[workspace]
members = ["ui-kit", "examples/kit-gallery"]

[package]
name = "citrate-studio"
version = "0.1.0"
edition = "2021"
authors = ["Citrate Network"]
license = "BUSL-1.1"
description = "Citrate Studio — the native agent-harness interface (Slint). The forward-looking UI kit for all Citrate native apps."
repository = "https://github.com/CitrateNetwork/citrate-studio"
build = "build.rs"

[[bin]]
name = "citrate-studio"
path = "src/main.rs"

[dependencies]
# Latest stable Slint. Default features give winit + femtovg + the
# compat-1-2 surface + accessibility. No "weird" deps: this is the
# standard desktop path. Skia can be swapped in for max text fidelity
# by replacing default-features with the renderer-skia feature.
slint = { version = "1.16", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "std",
] }

png = "0.17"

# Auth (STUDIO-2). PKCE + signer_id (pure), plus the native loopback-PKCE
# client: a blocking HTTP client (ureq, rustls — no openssl), a loopback
# listener (tiny_http), OS-keyring token storage (keyring), and entropy
# (getrandom). The ID token is trusted from the direct /token TLS response
# per OIDC Core §3.1.3.7, so no jsonwebtoken/JWKS dependency is needed.
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
getrandom = "0.2"
ureq = "2"
tiny_http = "0.12"
keyring = "2"
# STUDIO-4 — real ed25519 signer keys (matches the runtime's native scheme).
ed25519-dalek = "2.1"

# STUDIO-3 — the real runtime core, behind the `core-live` feature (off by
# default). Pulls wasmtime 45 + an SSH-sourced citrate-wallet-core (rev cached
# locally), so it stays optional while the integration matures subsystem by
# subsystem. When all subsystems are live, `core-live` becomes default and the
# in-process model is deleted.
citrate-agent-core = { path = "../citrate-agent-runtime/agent/core", optional = true }
# STUDIO-6 — drive the real async ApprovalQueue + real capsule dispatch.
# Both are already in the lock via agent-core, so these add no build cost.
tokio = { version = "1", features = ["rt-multi-thread", "time"], optional = true }
wasmtime = { version = "45", features = ["component-model"], optional = true }

[features]
core-live = ["dep:citrate-agent-core", "dep:tokio", "dep:wasmtime"]
# Demo/screenshot build: auto-seed a FileBacked signer roster on first run and persist its
# private keys to roster.json, so the approval flow works out of the box without keychain
# prompts. NEVER enable in a shipping build (audit F-3) — production seeds nothing and stores
# no plaintext key on disk.
dev-filebacked = []

[build-dependencies]
slint-build = "1.16"
# The shared design-system crate (theme/typography/icons/primitives + fonts).
# studio's build.rs reads its published @citrate-ui-kit library path.
citrate-studio-ui-kit = { path = "ui-kit" }

[profile.dev]
opt-level = 1          # Slint UIs are unbearable at opt-level 0; 1 keeps builds fast and the UI smooth.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true           # smaller, distribution-ready binaries

# STUDIO-9 — `cargo bundle` packaging metadata. Produces a macOS `.app`, a Linux
# `.deb`, and a Windows installer skeleton. Code-signing + notarization are CI
# steps gated on secrets (see .github/workflows/release.yml + RELEASE.md).
[package.metadata.bundle]
name = "Citrate Studio"
identifier = "ai.citrate.studio"
icon = ["assets/icon/AppIcon.icns"]
category = "Developer Tool"
short_description = "The native agent-harness interface for the Citrate runtime."
long_description = """
Citrate Studio is the native control surface for a compliance-first agent: hash-pinned
HITL approvals, the quorum lattice, separation-of-duties, frame-accurate audit replay, and
the doctor/tripwire health model — rendered directly from the citrate-agent-runtime
primitives.
"""
copyright = "Copyright © 2026 Citrate Network. BUSL-1.1."
