# RM-B1 / WP-F3.1 (audit SUP-10): committed cargo-deny config so the
# license-and-supply-chain check is reproducible and reviewable in PRs,
# instead of being smuggled in via an inline heredoc inside CI.
#
# Rule of thumb: the `licenses.allow` list is the smallest set that
# permits the current dependency graph. Adding a new license requires
# a PR that updates this file — which forces reviewers to confirm the
# license is acceptable for downstream redistribution.

[licenses]
# `confidence-threshold` is how confident cargo-deny needs to be before
# it accepts a detected license. 0.8 is the project default.
confidence-threshold = 0.8

# Allowed licenses. If a dependency reports a license not in this list,
# cargo-deny exits non-zero and the CI run fails (CI-04, CI-06).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # STUDIO-19 / audit F-7 (surfaced by actually running cargo-deny):
    "BUSL-1.1",  # the project's own license (citrate-studio + ui-kit + kit-gallery)
    "BSL-1.0",   # Boost Software License — permissive; via clipboard-win / error-code
    "CDLA-Permissive-2.0", # Community Data License Agreement — permissive (transitive)
    "NCSA",      # University of Illinois/NCSA — permissive, BSD-style (transitive)
    # Slint is tri-licensed (GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
    # LicenseRef-Slint-Software-3.0). We ship under the Slint Software 3.0 license — NOT GPL
    # (which would conflict with BUSL-1.1). Allowing this LicenseRef records that basis.
    "LicenseRef-Slint-Software-3.0",
]

# Explicit denies — block specific dependencies even if their license
# is in the allow-list. Add entries here if a transitive dep ships
# under a license the project shouldn't redistribute.
[[licenses.exceptions]]
allow = ["OpenSSL"]
name = "ring"

# Some crates ship without an SPDX-detectable license file. These
# are vetted by hand and listed here so cargo-deny doesn't fail.
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "encoding_rs"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 },
]

[advisories]
# RM-B1 / WP-F3.2 (audit CI-04, CI-06): treat unmaintained,
# yanked, and notice-level advisories as build failures. The CI
# step has no `|| true` and no `continue-on-error: true`, so any
# new RUSTSEC advisory blocks merges until triaged.
#
# RM-I / WP-I2.5 (re-audit Stream 7 doc-drift fix):
#   The header comment promised "treat unmaintained, yanked, and
#   notice-level advisories as build failures" but the config below
#   had `unmaintained = "warn"` and `notice = "warn"`. The 2026-04-25
#   re-audit caught the inconsistency. Now actually denied. Any
#   transitive dep that becomes unmaintained or carries a notice-level
#   advisory blocks merges until triaged or explicitly ignored below
#   with rationale.
yanked = "deny"
# cargo-deny 0.16+ schema: `unmaintained` is a scope enum (all|workspace|transitive|none),
# not "deny"/"warn"; "all" checks every crate. `notice`/`unsound`/`vulnerability` keys were
# removed — advisories are errors by default and are silenced only via `ignore` below.
unmaintained = "all"
#
# Inline exceptions (each requires a one-line justification):
ignore = [
    # Vulnerability ignores — mirrors this repo's audit.toml (refreshed 2026-09-07,
    # audit ST-B-010). `webbrowser` + `crossbeam-epoch` were CLOSED by a cargo update,
    # not ignored. Each remaining entry is build-time-only or core-live-only; full
    # reachability rationale is in audit.toml.
    # DEFAULT graph but BUILD-TIME only (wayland-scanner proc-macro parses trusted
    # in-tree Wayland XML at build; no runtime input reaches quick-xml):
    "RUSTSEC-2026-0194", # quick-xml quadratic dup-attribute check (DoS) — build-time
    "RUSTSEC-2026-0195", # quick-xml ns-decl memory exhaustion (DoS) — build-time
    # OPTIONAL core-live tree only — not compiled in the shipping build; owner is
    # citrate-agent-runtime (escalate the wasmtime bump there — 0269 is CVSS 8.8):
    "RUSTSEC-2025-0055", # tracing-subscriber ANSI/log injection (Low)
    "RUSTSEC-2026-0269", # wasmtime fs-sandbox escape (trailing slashes), CVSS 8.8
    "RUSTSEC-2026-0188", # wasmtime-wasi hardlink/rename FilePerms bypass
    "RUSTSEC-2026-0222", # wasmtime type indices mixed across engines
    "RUSTSEC-2026-0182", # wasmtime-wasi fd_renumber leak
    "RUSTSEC-2026-0258", # h2 unbounded empty DATA frames (DoS)
    "RUSTSEC-2026-0220", # ruint Uint shift overflow flags/truncation

    # STUDIO-19 / audit F-7: the 6 transitive UNMAINTAINED advisories below are
    # informational (cargo-audit treats them as non-failing warnings). With
    # `unmaintained = "deny"` above, cargo-deny would fail on them, so each is
    # ignored here with rationale mirroring audit.toml. None is in a trust-bearing
    # path; re-evaluate when the upstream crate is replaced.
    "RUSTSEC-2025-0141", # bincode 1.x/2.x unmaintained — via Slint (i-slint-compiler) + sled trees
    "RUSTSEC-2024-0388", # derivative unmaintained — via keyring→zbus + arkworks (core-live)
    "RUSTSEC-2024-0384", # instant unmaintained — via keyring→zbus→async-io
    "RUSTSEC-2024-0436", # paste unmaintained — via image→ravif (Slint) + wasmtime (core-live)
    "RUSTSEC-2025-0124", # rand_os unmaintained — via bip39→citrate-wallet-core (core-live)
]

[bans]
# Surface duplicate transitive deps; many duplicates are fine
# (e.g., `winapi` 0.2 vs 0.3) but tracking them keeps the graph
# from drifting silently.
multiple-versions = "warn"
wildcards = "deny"
# First-party path deps (e.g. the workspace `citrate-studio-ui-kit`) have no version req and
# read as wildcards; allow that for path deps only — external wildcards stay denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
# Block any registry/git source other than crates.io + a small
# allow-list. Prevents a malicious PR from substituting a fork
# of a critical dep without anyone noticing.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# STUDIO-19 / audit F-7: the OPTIONAL `core-live` tree pulls citrate-wallet-core /
# -execution / -consensus from the org's chain monorepo over SSH, pinned to an
# immutable rev in Cargo.lock. Allow exactly that source so `cargo deny check`
# passes deterministically; everything else stays denied.
allow-git = ["ssh://git@github-citrate-chain/CitrateNetwork/citrate-chain"]
